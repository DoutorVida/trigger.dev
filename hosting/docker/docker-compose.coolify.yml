# Self-host stack for Coolify: webapp + worker in one file.
#
# Coolify resource (Git, not "Docker Compose Empty"):
#   Base directory: /hosting/docker
#   Compose file: docker-compose.coolify.yml
#   Preserve repository during deployment: on
# The ClickHouse config is ./clickhouse/*.xml. Those files have to stay on disk.
#
# One stack per Docker host. The network names are fixed because the supervisor
# attaches task runners to webapp and supervisor.

name: trigger

x-logging: &logging-config
  driver: ${LOGGING_DRIVER:-local}
  options:
    max-size: ${LOGGING_MAX_SIZE:-20m}
    max-file: ${LOGGING_MAX_FILES:-5}
    compress: ${LOGGING_COMPRESS:-true}

services:
  webapp:
    image: ghcr.io/triggerdotdev/trigger.dev:${TRIGGER_IMAGE_TAG:-v4.5.0}
    restart: unless-stopped
    logging: *logging-config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      s2:
        condition: service_started
    networks:
      - webapp
      - supervisor
    volumes:
      - shared:/home/node/shared
    # Only needed for bootstrap
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec ./scripts/entrypoint.sh"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "http.get('http://localhost:3000/healthcheck', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      NODE_ENV: production
      TRIGGER_TELEMETRY_DISABLED: ${TRIGGER_TELEMETRY_DISABLED:-1}
      # Set APP_ORIGIN, LOGIN_ORIGIN and API_ORIGIN in Coolify to the public
      # URL (https://trigger4.<dominio>, no trailing slash, no :3000).
      # An empty SERVICE_URL_* makes the webapp refuse to boot.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8030}
      LOGIN_ORIGIN: ${LOGIN_ORIGIN:-http://localhost:8030}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8030}
      ELECTRIC_ORIGIN: http://electric:3000
      REALTIME_STREAMS_DEFAULT_VERSION: ${REALTIME_STREAMS_DEFAULT_VERSION:-v2}
      REALTIME_STREAMS_S2_BASIN: ${REALTIME_STREAMS_S2_BASIN:-trigger-realtime}
      REALTIME_STREAMS_S2_ENDPOINT: ${REALTIME_STREAMS_S2_ENDPOINT:-http://s2/v1}
      REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS: ${REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS:-true}
      REALTIME_STREAMS_S2_ACCESS_TOKEN: ${REALTIME_STREAMS_S2_ACCESS_TOKEN:-}
      DATABASE_URL: postgresql://postgres:${SERVICE_HEX_32_POSTGRES}@postgres:5432/main?schema=public&sslmode=disable
      DIRECT_URL: postgresql://postgres:${SERVICE_HEX_32_POSTGRES}@postgres:5432/main?schema=public&sslmode=disable
      SESSION_SECRET: ${SERVICE_HEX_32_SESSION}
      MAGIC_LINK_SECRET: ${SERVICE_HEX_32_MAGICLINK}
      MAGIC_LINK_SAME_BROWSER_REQUIRED: "true"
      ENCRYPTION_KEY: ${SERVICE_HEX_32_ENCRYPTION}
      PROVIDER_SECRET: ${SERVICE_HEX_32_PROVIDER}
      COORDINATOR_SECRET: ${SERVICE_HEX_32_COORDINATOR}
      MANAGED_WORKER_SECRET: ${SERVICE_HEX_32_MANAGEDWORKER}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TLS_DISABLED: "true"
      APP_LOG_LEVEL: info
      DEV_OTEL_EXPORTER_OTLP_ENDPOINT: ${APP_ORIGIN:-http://localhost:8030}/otel
      # Public hostname once the registry domain exists. Until then the
      # in-stack registry is reachable as registry:5000.
      DEPLOY_REGISTRY_HOST: ${DOCKER_REGISTRY_URL:-registry:5000}
      DEPLOY_REGISTRY_NAMESPACE: ${DOCKER_REGISTRY_NAMESPACE:-trigger}
      OBJECT_STORE_BASE_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-admin}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${SERVICE_HEX_32_OBJECTSTORE}
      GRACEFUL_SHUTDOWN_TIMEOUT: "1000"
      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-4800}
      # Combined stack only. The webapp writes the worker token; the supervisor reads it.
      TRIGGER_BOOTSTRAP_ENABLED: "1"
      TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME: bootstrap
      TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH: /home/node/shared/worker_token
      CLICKHOUSE_URL: http://default:${SERVICE_HEX_32_CLICKHOUSE}@clickhouse:8123?secure=false
      CLICKHOUSE_LOG_LEVEL: ${CLICKHOUSE_LOG_LEVEL:-info}
      RUN_REPLICATION_ENABLED: "1"
      RUN_REPLICATION_CLICKHOUSE_URL: http://default:${SERVICE_HEX_32_CLICKHOUSE}@clickhouse:8123
      RUN_REPLICATION_LOG_LEVEL: ${RUN_REPLICATION_LOG_LEVEL:-info}
      EVENT_REPOSITORY_DEFAULT_STORE: ${EVENT_REPOSITORY_DEFAULT_STORE:-clickhouse_v2}
      INTERNAL_OTEL_TRACE_LOGGING_ENABLED: "0"

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-14}
    restart: unless-stopped
    logging: *logging-config
    volumes:
      - postgres:/var/lib/postgresql/data/
    networks:
      - webapp
    command: ["-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_HEX_32_POSTGRES}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7}
    restart: unless-stopped
    logging: *logging-config
    volumes:
      - redis:/data
    networks:
      - webapp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  electric:
    image: electricsql/electric:${ELECTRIC_IMAGE_TAG:-1.2.4}
    restart: unless-stopped
    logging: *logging-config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - webapp
    environment:
      DATABASE_URL: postgresql://postgres:${SERVICE_HEX_32_POSTGRES}@postgres:5432/main?schema=public&sslmode=disable
      ELECTRIC_INSECURE: "true"
      ELECTRIC_USAGE_REPORTING: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_IMAGE_TAG:-26.2}
    restart: unless-stopped
    logging: *logging-config
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${SERVICE_HEX_32_CLICKHOUSE}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/data-paths.xml:/etc/clickhouse-server/config.d/data-paths.xml:ro
      - ./clickhouse/override.xml:/etc/clickhouse-server/config.d/override.xml:ro
      - ./clickhouse/users-override.xml:/etc/clickhouse-server/users.d/override.xml:ro
    networks:
      - webapp
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--host",
          "localhost",
          "--port",
          "9000",
          "--user",
          "default",
          "--password",
          "${SERVICE_HEX_32_CLICKHOUSE}",
          "--query",
          "SELECT 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  registry-auth-init:
    image: httpd:2
    restart: "no"
    environment:
      DOCKER_REGISTRY_USERNAME: ${DOCKER_REGISTRY_USERNAME:-registry-user}
      DOCKER_REGISTRY_PASSWORD: ${SERVICE_HEX_32_REGISTRY}
    volumes:
      - registry-auth:/auth
    entrypoint: ["sh", "-c"]
    command:
      - htpasswd -Bbn "$$DOCKER_REGISTRY_USERNAME" "$$DOCKER_REGISTRY_PASSWORD" > /auth/htpasswd && chmod 644 /auth/htpasswd
    networks:
      - webapp

  registry:
    image: registry:${REGISTRY_IMAGE_TAG:-2}
    restart: unless-stopped
    logging: *logging-config
    depends_on:
      registry-auth-init:
        condition: service_completed_successfully
    networks:
      - webapp
    volumes:
      - registry-auth:/auth
      - registry:/var/lib/registry
    environment:
      SERVICE_URL_REGISTRY_5000: ""
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: bitnamilegacy/minio:${MINIO_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging-config
    networks:
      - webapp
    volumes:
      - minio:/bitnami/minio/data
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID:-admin}
      MINIO_ROOT_PASSWORD: ${SERVICE_HEX_32_OBJECTSTORE}
      MINIO_DEFAULT_BUCKETS: packets
      MINIO_BROWSER: "on"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 15s

  s2-init:
    image: busybox:${BUSYBOX_IMAGE_TAG:-1.37}
    restart: "no"
    logging: *logging-config
    environment:
      REALTIME_STREAMS_S2_BASIN: ${REALTIME_STREAMS_S2_BASIN:-trigger-realtime}
    command:
      - sh
      - -c
      - |
        cat > /config/s2-spec.json <<JSON
        {
          "basins": [
            {
              "name": "$$REALTIME_STREAMS_S2_BASIN",
              "config": { "create_stream_on_append": true, "create_stream_on_read": true }
            }
          ]
        }
        JSON
    volumes:
      - s2-config:/config
    networks:
      - webapp

  s2:
    image: ${S2_IMAGE:-ghcr.io/s2-streamstore/s2:latest@sha256:d6ded5ca7dd619fa7c946f06e39a98f9c95c6883c8bb884e5eaa129f232c920c}
    restart: unless-stopped
    logging: *logging-config
    depends_on:
      s2-init:
        condition: service_completed_successfully
    command: ["lite", "--init-file", "/config/s2-spec.json", "--local-root", "/data"]
    user: "0:0"
    volumes:
      - s2-config:/config
      - s2:/data
    networks:
      - webapp

  supervisor:
    image: ghcr.io/triggerdotdev/supervisor:${TRIGGER_IMAGE_TAG:-v4.5.0}
    restart: unless-stopped
    logging: *logging-config
    depends_on:
      docker-proxy:
        condition: service_healthy
      webapp:
        condition: service_healthy
    networks:
      - supervisor
      - docker-proxy
      - webapp
    volumes:
      - shared:/home/node/shared
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec /usr/bin/dumb-init -- pnpm run --filter supervisor start"
    environment:
      TRIGGER_WORKER_TOKEN: file:///home/node/shared/worker_token
      MANAGED_WORKER_SECRET: ${SERVICE_HEX_32_MANAGEDWORKER}
      TRIGGER_API_URL: http://webapp:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://webapp:3000/otel
      TRIGGER_WORKLOAD_API_DOMAIN: supervisor
      TRIGGER_WORKLOAD_API_PORT_EXTERNAL: "8020"
      ENFORCE_MACHINE_PRESETS: "1"
      TRIGGER_DEQUEUE_INTERVAL_MS: "1000"
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_RUNNER_NETWORKS: webapp,supervisor
      DOCKER_REGISTRY_URL: ${DOCKER_REGISTRY_URL:-registry:5000}
      DOCKER_REGISTRY_USERNAME: ${DOCKER_REGISTRY_USERNAME:-registry-user}
      DOCKER_REGISTRY_PASSWORD: ${SERVICE_HEX_32_REGISTRY}
      DOCKER_AUTOREMOVE_EXITED_CONTAINERS: "0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "http.get('http://localhost:8020/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  docker-proxy:
    image: tecnativa/docker-socket-proxy:${DOCKER_PROXY_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging-config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy
    environment:
      LOG_LEVEL: info
      POST: "1"
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2375"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  clickhouse:
  postgres:
  redis:
  shared:
  minio:
  s2:
  s2-config:
  registry:
  registry-auth:

networks:
  docker-proxy:
    name: docker-proxy
  supervisor:
    name: supervisor
  webapp:
    name: webapp
